<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Chatting</title>
<style>
:root{--bg:#f7f7fb;--ink:#1f2330;--muted:#717784;--line:#e7e8ee;--accent:#2878db}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:16px}main{max-width:790px;margin:0 auto;padding:36px 20px}h1{font-size:34px;letter-spacing:-1px;margin:0 0 10px}.intro{color:var(--muted);line-height:1.6;margin:0 0 22px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2px;margin-bottom:9px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}select,button{font:inherit;border:1px solid var(--line);border-radius:12px;background:white;padding:10px 14px;color:var(--ink)}button{cursor:pointer;transition:background .15s,transform .15s}button:hover:not(:disabled){background:#eef6ff;border-color:#96bff0}button:focus-visible,select:focus-visible{outline:3px solid #96bff0;outline-offset:3px}button:disabled{cursor:default;opacity:.5}.toolbar select{flex:1}.toolbar button{font-size:13px}.progress-row{display:flex;align-items:center;gap:12px;margin:16px 0}.track{height:7px;background:#e7e7f0;border-radius:10px;flex:1;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#2878db,#7bbcff);transition:width .3s}#count{font-size:13px;color:var(--muted)}.chat{background:white;border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px #1f23300d;overflow:hidden}.head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.avatar{background:linear-gradient(145deg,#b9daf9,#438ede);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;color:#fff;font-weight:800}.title{font-weight:750}.status{font-size:12px;color:var(--muted);margin-top:4px}.body{padding:24px;display:flex;flex-direction:column;gap:16px;min-height:200px;background:linear-gradient(#fff,#fcfdff)}.context{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:1px}.bubble{max-width:85%;border-radius:17px;padding:13px 16px;font-size:16px;line-height:1.5;animation:appear .25s ease}.mine{align-self:flex-end;background:#e1efff;border-bottom-right-radius:5px}.theirs{align-self:flex-start;background:#eceef3;border-bottom-left-radius:5px}strong.target{background:#cbe3ff;color:#15579c;padding:1px 3px;border-radius:5px;font-weight:800}.composer{display:flex;gap:12px;align-items:center;padding:18px 22px;border-top:1px solid var(--line)}.draft{flex:1;line-height:1.5;background:#f7f7fb;border:1px solid var(--line);border-radius:12px;padding:12px 14px}.primary{background:var(--accent);color:white;border-color:var(--accent);font-weight:650}.primary:hover:not(:disabled){background:#1c61b7;color:white}.typing{display:flex;gap:5px;padding:18px}.dot{width:6px;height:6px;background:#9297a3;border-radius:50%;animation:bounce 1s infinite}.dot:nth-child(2){animation-delay:.14s}.dot:nth-child(3){animation-delay:.28s}@keyframes bounce{0%,70%,100%{transform:translateY(0);opacity:.55}35%{transform:translateY(-5px);opacity:1}}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.choices{display:grid;gap:10px}.label{font-size:12px;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:1px;margin:0 0 2px}.option{text-align:left;font-size:15px;line-height:1.45;padding:13px 16px}.option.bad{background:#fff0ee;border-color:#e7aea7;color:#9c433a}.option.good{background:#edf7ee;border-color:#96c8a3;color:#226638}.feedback{border-top:1px solid var(--line);padding:22px}.meaning{font-size:16px;line-height:1.6;margin:0 0 16px}.talk{background:#eff7ff;border:1px solid #d4e8fb;border-radius:15px;padding:17px}.talk h2{font-size:13px;color:#2369ad;margin:0 0 7px}.talk p{margin:0;line-height:1.6}.next-row{display:flex;justify-content:flex-end;margin-top:18px}.notice{font-size:14px;color:#9c433a;line-height:1.5;margin:0}.footer{margin-top:16px;color:var(--muted);text-align:center;font-size:12px;line-height:1.6}.complete{padding:38px 24px;text-align:center}.complete h2{margin:0 0 10px}.complete p{line-height:1.6;color:var(--muted)}[hidden]{display:none!important}@media(max-width:550px){main{padding:24px 12px}h1{font-size:29px}.body{padding:18px}.composer{padding:15px;align-items:stretch}.draft{font-size:14px}.bubble{max-width:95%}.toolbar select{width:100%;flex:auto}.toolbar button{flex:1}.feedback{padding:18px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><h1>Business Chatting</h1><div class="toolbar"><button id="shuffle">Shuffle</button><button id="restart">Start again</button></div><div class="progress-row"><div class="track" role="progressbar" aria-label="Completed conversations" aria-valuemin="0" aria-valuenow="0" id="progress"><div class="bar" id="bar"></div></div><span id="count"></span></div><section class="chat" aria-label="Practice chat"><div class="head"><div class="avatar" aria-hidden="true">A</div><div><div class="title" id="title"></div><div class="status" id="status">Alex · online</div></div></div><div id="conversation"></div></section></main>
<script>
const DATA=[{"category": "Arrangements", "title": "Tuesday plans", "prompt": "Shall we meet on Tuesday?", "reply": "I can't make Tuesday.", "target": "can't make", "meaning": "be unable to attend", "good": "Let’s reschedule for Wednesday.", "bad": "Great, see you on Tuesday!", "question": "When can’t you make a meeting at work? How do you let people know?"}, {"category": "Arrangements", "title": "A change of plans", "prompt": "Are we still meeting at three?", "reply": "Something has come up.", "target": "Something has come up", "meaning": "something unexpected has happened", "good": "Shall we choose another time?", "bad": "Great, everything is going as planned.", "question": "Can you remember a time when something came up and changed your work plans? What did you do or say?"}, {"category": "Arrangements", "title": "A later date", "prompt": "Can we still meet tomorrow?", "reply": "Can we put it off till the 22nd?", "target": "put it off", "meaning": "postpone it", "good": "Yes, the 22nd works for me.", "bad": "Sure, let’s meet earlier today.", "question": "What tasks do you most often put off at work or when studying, and why?"}, {"category": "Arrangements", "title": "A busy week", "prompt": "Can you meet next week?", "reply": "I’m completely snowed under.", "target": "snowed under", "meaning": "very busy with work", "good": "No problem. We can find a quieter week.", "bad": "Great, you have plenty of free time!", "question": "When do you usually feel snowed under at work or when studying?"}, {"category": "Arrangements", "title": "No date yet", "prompt": "Which date should we choose?", "reply": "Can we leave it open?", "target": "leave it open", "meaning": "avoid deciding for now", "good": "Sure, we can decide later.", "bad": "Great, I’ll book Tuesday now.", "question": "When arranging a meeting, what do you sometimes need to leave open: the date, the time, or the place?"}, {"category": "Arrangements", "title": "An update later", "prompt": "When will you know your schedule?", "reply": "I’ll get back in touch on Friday.", "target": "get back in touch", "meaning": "contact you again", "good": "Thanks, I’ll wait for your update.", "bad": "So we’ll never speak again?", "question": "Who do you usually get back in touch with after a work meeting, and what do you contact them about?"}, {"category": "Arrangements", "title": "Choosing a time", "prompt": "We need to talk about the next stage of the project.", "reply": "Can we fix a meeting for next week?", "target": "fix a meeting", "meaning": "arrange a meeting", "good": "Yes, how about Thursday morning?", "bad": "Yes, I’ll repair the meeting room.", "question": "When you need to fix a meeting, how do you choose a time that works for everyone?"}, {"category": "Arrangements", "title": "Choosing a time", "prompt": "We have a few ideas to discuss before Friday.", "reply": "Would it be useful to meet up tomorrow?", "target": "meet up", "meaning": "meet someone", "good": "Yes, let’s find a time.", "bad": "Yes, let’s avoid meeting until next month.", "question": "Who do you usually meet up with to discuss work or study, and where?"}, {"category": "Arrangements", "title": "Choosing a time", "prompt": "We need to discuss the project this week.", "reply": "Would Wednesday be suitable?", "target": "be suitable", "meaning": "work well for someone", "good": "Yes, I’m free on Wednesday.", "bad": "Yes, I’ll send the finished project yesterday.", "question": "What time would be suitable for a short team meeting in your working day?"}, {"category": "Phone calls", "title": "A quick conversation", "prompt": "How will you contact me?", "reply": "I’ll give you a call after lunch.", "target": "give you a call", "meaning": "phone you", "good": "Great, I’ll keep my phone nearby.", "bad": "Great, I’ll wait for a letter in the post.", "question": "What work situations make you give someone a call rather than send a message?"}, {"category": "Phone calls", "title": "On the phone", "prompt": "Can you join the team meeting on Thursday?", "reply": "I’ll get back to you after I check my schedule.", "target": "get back to you", "meaning": "reply or contact you later", "good": "Sure, let me know when you’ve checked.", "bad": "Great, I’ll mark you as confirmed now.", "question": "What questions at work do you need time to check before you can get back to someone?"}, {"category": "Phone calls", "title": "On the phone", "prompt": "The team meeting is at fifteen thirty.", "reply": "I didn’t catch the time.", "target": "didn’t catch", "meaning": "did not hear or understand", "good": "It’s at half past three.", "bad": "Yes, I’ve already booked the room.", "question": "What do you most often fail to catch during a work call: names, numbers, or instructions?"}, {"category": "Closing conversations", "title": "Wrapping up", "prompt": "I’ll check with my team and send you our ideas tomorrow.", "reply": "Great, I look forward to hearing from you.", "target": "look forward to hearing from you", "meaning": "hope to receive your reply", "good": "I’ll message you once we’ve discussed it.", "bad": "Okay, I won’t send you anything, then.", "question": "At work or when studying, whose reply do you most look forward to hearing, and why?"}, {"category": "Meetings", "title": "Team discussion", "prompt": "Everyone’s here. How was your weekend?", "reply": "Let’s get down to business.", "target": "get down to business", "meaning": "start discussing the main work", "good": "Sure, let’s start with the project update.", "bad": "Sure, tell us more about your weekend.", "question": "At the start of a work meeting, do you prefer to get down to business straight away or chat first? Why?"}, {"category": "Meetings", "title": "Team discussion", "prompt": "Who wants to start the discussion?", "reply": "Would you like to get the ball rolling?", "target": "get the ball rolling", "meaning": "start an activity or discussion", "good": "Yes, I’ll introduce the first idea.", "bad": "Yes, I’ll wait until everyone finishes.", "question": "What helps you get the ball rolling when everyone in a meeting is quiet?"}, {"category": "Meetings", "title": "Team discussion", "prompt": "The next point is the launch date.", "reply": "Sorry to interrupt you, but I have a question.", "target": "Sorry to interrupt you", "meaning": "a polite way to stop someone speaking", "good": "Of course, go ahead.", "bad": "Please save your question; I’m leaving now.", "question": "When do you need to say “Sorry to interrupt you” at work or in class?"}, {"category": "Meetings", "title": "Team discussion", "prompt": "Let’s invite just three people instead of the whole team.", "reply": "If I follow you, you want a smaller meeting.", "target": "If I follow you", "meaning": "if I understand your reasoning", "good": "Exactly, only the people working on this task.", "bad": "Yes, follow me to the station.", "question": "What instructions at work or in class do you need to check using “If I follow you …”?"}, {"category": "Meetings", "title": "Team discussion", "prompt": "We could delay the project by a month.", "reply": "I take your point, but we have a deadline.", "target": "I take your point", "meaning": "I understand your argument", "good": "Could we reduce the scope instead?", "bad": "Great, you fully agree to remove the deadline.", "question": "A colleague wants to spend more time planning before starting a task. What would you say using “I take your point, but …”?"}, {"category": "Meetings", "title": "Team discussion", "prompt": "Have we found a plan most people support?", "reply": "We’ve reached a consensus.", "target": "reached a consensus", "meaning": "found broad agreement in the group", "good": "Great, let’s record the agreed plan.", "bad": "So most of us still oppose the plan.", "question": "What decisions does your team usually need to reach a consensus on?"}, {"category": "Meetings", "title": "Team discussion", "prompt": "How much have we discussed today?", "reply": "We’ve covered a lot of ground.", "target": "covered a lot of ground", "meaning": "discussed many things", "good": "Yes, we’ve discussed the budget, dates, and team.", "bad": "Yes, we haven’t discussed anything yet.", "question": "Think of a meeting where you covered a lot of ground. What did you discuss?"}, {"category": "Meetings", "title": "Team discussion", "prompt": "We have five minutes left.", "reply": "We’re running out of time.", "target": "running out of time", "meaning": "have very little time left", "good": "Let’s focus on the final decision.", "bad": "Great, let’s add five new topics.", "question": "When do you usually find yourself running out of time at work or in a meeting? What do you do?"}, {"category": "Meetings", "title": "Team discussion", "prompt": "That suggestion is completely ridiculous!", "reply": "Could you tone down your comments?", "target": "tone down", "meaning": "make less harsh or forceful", "good": "Of course, I’ll express that more calmly.", "bad": "Of course, I’ll criticise them more strongly.", "question": "Have you ever had to tone down a work message before sending it? Why?"}, {"category": "Meetings", "title": "Team discussion", "prompt": "Anyway, let me tell you about my new flat.", "reply": "You’re getting off the point.", "target": "getting off the point", "meaning": "moving away from the topic", "good": "You’re right. Back to the budget.", "bad": "Good idea, let me tell you about my holiday.", "question": "Do you often get off the point in work discussions? What helps you stay focused?"}, {"category": "Meetings", "title": "Team discussion", "prompt": "We’ve spent an hour discussing tiny details.", "reply": "We can’t see the wood for the trees.", "target": "can’t see the wood for the trees", "meaning": "miss the overall picture because of details", "good": "Let’s step back and look at the main goal.", "bad": "Let’s add even more small details.", "question": "When a work task has lots of details, do you sometimes feel you can’t see the wood for the trees? What helps?"}, {"category": "Meetings", "title": "Team discussion", "prompt": "We’ve agreed on the first item. What now?", "reply": "Let’s keep the ball rolling.", "target": "keep the ball rolling", "meaning": "continue making progress", "good": "Okay, let’s move to the next item.", "bad": "Okay, let’s stop without finishing.", "question": "What helps your team keep the ball rolling when a project gets difficult?"}, {"category": "Meetings", "title": "Team discussion", "prompt": "I’m not sure I should share my concerns about the plan.", "reply": "Come out and say what you think.", "target": "Come out and say", "meaning": "express openly", "good": "I think the deadline is too tight.", "bad": "I’ll keep my opinion to myself.", "question": "When is it difficult to come out and say what you think at work or in class?"}, {"category": "Meetings", "title": "Team discussion", "prompt": "We didn’t plan to discuss this problem today.", "reply": "It’s not on the agenda, but we need to discuss it.", "target": "on the agenda", "meaning": "included in the planned meeting topics", "good": "Okay, let’s make time for this extra topic.", "bad": "So it was already one of our planned topics.", "question": "Do you suggest things to put on the agenda for meetings? What would you like to add next time?"}, {"category": "Meetings", "title": "Talking it through", "prompt": "I’m not sure which option to choose.", "reply": "Let’s talk it through.", "target": "talk it through", "meaning": "discuss something carefully", "good": "Sure, let’s compare the options.", "bad": "Sure, I’ll choose without discussing it.", "question": "Who do you talk things through with when you have a difficult decision at work?"}, {"category": "Meetings", "title": "Checking the plan", "prompt": "I’ll write the report, and you’ll prepare the slides.", "reply": "Let’s make sure we’re on the same page.", "target": "on the same page", "meaning": "have the same understanding", "good": "Right, you’re doing the report and I’m doing the slides.", "bad": "Yes, I’ll move my chair next to yours.", "question": "Before a group task, how do you check that everyone is on the same page?"}, {"category": "Meetings", "title": "A quick explanation", "prompt": "I haven’t used this booking system before.", "reply": "I can walk you through it.", "target": "walk you through", "meaning": "explain something step by step", "good": "Thanks, show me where to start.", "bad": "Thanks, I’ll meet you outside for a walk.", "question": "What task or app could you walk a new colleague through?"}, {"category": "Meetings", "title": "A second opinion", "prompt": "I’ve drafted a message to the client, but I’m not sure about it.", "reply": "Would you like to run it by me?", "target": "run it by me", "meaning": "ask me for feedback or approval", "good": "Yes, I’ll send you the draft for feedback.", "bad": "Yes, I’ll send it to the client without checking it.", "question": "What do you usually run by someone else before sending or deciding?"}, {"category": "Meetings", "title": "Thinking of ideas", "prompt": "We need a name for the new project.", "reply": "Let’s bounce some ideas around.", "target": "bounce some ideas around", "meaning": "share and discuss possible ideas", "good": "Sure, what about “Fresh Start”?", "bad": "Sure, let’s choose without sharing any ideas.", "question": "Who do you like to bounce ideas around with, and what do you discuss?"}, {"category": "Meetings", "title": "A topic for later", "prompt": "We also need to talk about next month’s event.", "reply": "Let’s park that for now.", "target": "park that for now", "meaning": "set a topic aside to discuss later", "good": "Okay, let’s finish today’s deadline first.", "bad": "Okay, let’s spend the rest of this meeting on the event.", "question": "What topics would you park for now if your meeting was nearly over?"}, {"category": "Meetings", "title": "One clear request", "prompt": "I’ve explained the background to the project.", "reply": "What exactly do you need from me?", "target": "What exactly do you need from me", "meaning": "ask for a clear task or request", "good": "Could you review the slides by Friday?", "bad": "Let me repeat all the background again.", "question": "When do you wish someone at work would explain exactly what they need from you?"}, {"category": "Meetings", "title": "Checking an update", "prompt": "Has the client replied about the meeting date?", "reply": "I’ll follow up with them today.", "target": "follow up", "meaning": "contact someone again to check progress", "good": "Thanks, let me know what they say.", "bad": "Thanks, let’s stop contacting them completely.", "question": "When do you usually follow up if someone hasn’t replied to your work message?"}];
const $=id=>document.getElementById(id);let order=[],position=0,done=new Set(),timer=null,phase='ready';
const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function highlight(item){const start=item.reply.indexOf(item.target);return escapeHTML(item.reply.slice(0,start))+'<strong class="target">'+escapeHTML(item.target)+'</strong>'+escapeHTML(item.reply.slice(start+item.target.length));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function progress(){const n=order.filter(i=>done.has(i)).length;$('count').textContent=`${n} / ${order.length} completed`;$('bar').style.width=`${order.length?n/order.length*100:0}%`;$('progress').setAttribute('aria-valuemax',order.length);$('progress').setAttribute('aria-valuenow',n);}
function start(random=false){clearTimeout(timer);order=DATA.map((x,i)=>i);if(random)shuffle(order);position=0;done.clear();render();}
function render(){clearTimeout(timer);phase='ready';progress();$('status').textContent='Alex · online';if(position===order.length){$('title').textContent='Conversation complete';$('conversation').innerHTML='<div class="complete"><h2>Nicely done, both of you!</h2><p>Choose three phrases and use them in a short conversation.<br>Which phrase will you use first in real life?</p><button id="again" class="primary">Play again</button></div>';$('again').onclick=()=>start();return;}
const item=DATA[order[position]];$('title').textContent=item.title;$('conversation').innerHTML=`<div class="body" id="messages" aria-live="polite"><div class="context">${escapeHTML(item.category)} · Conversation ${position+1} of ${order.length}</div></div><div class="composer" id="composer"><div class="draft">${escapeHTML(item.prompt)}</div><button class="primary" id="send">Send ↗</button></div><div id="feedback" class="feedback" hidden aria-live="polite"></div>`;$('send').onclick=send;}
function send(){if(phase!=='ready')return;phase='typing';const item=DATA[order[position]];$('composer').hidden=true;$('messages').insertAdjacentHTML('beforeend',`<div class="bubble mine">${escapeHTML(item.prompt)}</div><div class="bubble theirs typing" id="typing" aria-label="Alex is typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`);$('status').textContent='Alex is typing…';timer=setTimeout(()=>{phase='choosing';$('status').textContent='Alex · online';$('typing').outerHTML=`<div class="bubble theirs">${highlight(item)}</div>`;const answers=shuffle([{text:item.good,correct:true},{text:item.bad,correct:false}]);const box=document.createElement('div');box.className='choices';box.innerHTML='<p class="label">Your turn — choose the best reply</p><p class="notice" id="notice" hidden></p>';answers.forEach((a,i)=>{const b=document.createElement('button');b.className='option';b.textContent=`${i?'B':'A'}. ${a.text}`;b.onclick=()=>choose(b,a,item);box.append(b);});$('messages').append(box);},1100);}
function choose(button,answer,item){if(phase!=='choosing')return;if(!answer.correct){button.classList.add('bad');button.disabled=true;$('notice').hidden=false;$('notice').textContent='Not quite. Read Alex’s phrase again and try the other reply.';return;}phase='answered';button.classList.add('good');document.querySelectorAll('.option').forEach(b=>b.disabled=true);$('notice').hidden=true;done.add(order[position]);progress();$('messages').insertAdjacentHTML('beforeend',`<div class="bubble mine">${escapeHTML(answer.text)}</div>`);const f=$('feedback');f.hidden=false;f.innerHTML=`<p class="meaning">✓ Correct! <strong>${escapeHTML(item.target)}</strong> — ${escapeHTML(item.meaning)}.</p><div class="talk"><h2>Discuss together</h2><p>${escapeHTML(item.question)}</p></div><div class="next-row"><button class="primary" id="next">${position===order.length-1?'Finish':'Next conversation →'}</button></div>`;$('next').onclick=()=>{position++;render();$('title').scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});};}
$('shuffle').onclick=()=>start(true);$('restart').onclick=()=>start();start();
</script></body></html>
